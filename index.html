<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FunctionEstimator</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel data-panel" aria-labelledby="data-heading">
        <div class="section-head">
          <div>
            <p class="eyebrow">Symbolic regression</p>
            <h1 id="data-heading">FunctionEstimator</h1>
          </div>
          <div class="example-row" aria-label="Example presets">
            <button class="small-button" type="button" data-example="quadratic">x^2 + 1</button>
            <button class="small-button" type="button" data-example="sparse">Sparse</button>
            <button class="small-button" type="button" data-example="prime">Prime labels</button>
            <button class="small-button" type="button" data-example="sine">Sine</button>
          </div>
        </div>

        <div class="data-grid">
          <div class="table-wrap">
            <table aria-label="Training points">
              <thead>
                <tr>
                  <th>x</th>
                  <th>y</th>
                  <th><span class="sr-only">Row actions</span></th>
                </tr>
              </thead>
              <tbody id="pointTable"></tbody>
            </table>
            <div class="row-actions">
              <button type="button" id="addRowButton">Add row</button>
              <button type="button" id="clearButton" class="secondary">Clear</button>
            </div>
          </div>

          <div class="paste-box">
            <label for="pasteInput">Paste two-column values</label>
            <textarea id="pasteInput" rows="8" spellcheck="false" placeholder="0, 1&#10;1, 2&#10;2, 5&#10;3, 10"></textarea>
            <div class="row-actions">
              <button type="button" id="pasteButton">Import values</button>
              <span id="dataMessage" class="message" role="status"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel controls-panel" aria-labelledby="controls-heading">
        <div class="section-head compact">
          <div>
            <p class="eyebrow">Evolution controls</p>
            <h2 id="controls-heading">Search settings</h2>
          </div>
          <div class="run-actions">
            <button type="button" id="runButton" class="primary">Run</button>
            <button type="button" id="stopButton" class="secondary" disabled>Stop</button>
          </div>
        </div>

        <form class="control-grid" id="configForm">
          <label>
            Population
            <input id="populationInput" type="number" min="20" max="5000" step="10" value="600">
          </label>
          <label>
            Generations
            <input id="generationsInput" type="number" min="1" max="20000" step="25" value="1200">
          </label>
          <label>
            Mutation rate
            <input id="mutationInput" type="number" min="0.05" max="1" step="0.05" value="0.45">
          </label>
          <label>
            Complexity allowance
            <input id="complexityInput" type="number" min="1" max="30" step="1" value="6">
          </label>
          <label>
            Smoothness penalty
            <input id="smoothnessInput" type="number" min="0" max="2" step="0.01" value="0.04">
          </label>
          <label>
            Seed
            <input id="seedInput" type="text" value="function-estimator">
          </label>
        </form>

        <div class="progress-wrap" aria-label="Run progress">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <span id="runStatus" class="message" role="status">Ready</span>
        </div>
      </section>

      <section class="panel result-panel" aria-labelledby="result-heading">
        <div class="section-head compact">
          <div>
            <p class="eyebrow">Best approximation</p>
            <h2 id="result-heading">Current result</h2>
          </div>
          <button type="button" id="copyButton" class="secondary" disabled>Copy formula</button>
        </div>

        <div class="formula-box">
          <code id="formulaOutput">Run the search to estimate a function.</code>
        </div>

        <div class="metrics" aria-label="Fit metrics">
          <div>
            <span>MSE</span>
            <strong id="mseMetric">-</strong>
          </div>
          <div>
            <span>Nodes</span>
            <strong id="nodeMetric">-</strong>
          </div>
          <div>
            <span>Loss</span>
            <strong id="lossMetric">-</strong>
          </div>
          <div>
            <span>Generation</span>
            <strong id="generationMetric">-</strong>
          </div>
        </div>
      </section>

      <section class="visual-grid">
        <div class="panel chart-panel" aria-labelledby="chart-heading">
          <div class="section-head compact">
            <div>
              <p class="eyebrow">Data vs prediction</p>
              <h2 id="chart-heading">Plot</h2>
            </div>
          </div>
          <canvas id="plotCanvas" width="960" height="540" aria-label="Function plot"></canvas>
        </div>

        <div class="panel candidates-panel" aria-labelledby="candidate-heading">
          <div class="section-head compact">
            <div>
              <p class="eyebrow">Population leaders</p>
              <h2 id="candidate-heading">Best formulas</h2>
            </div>
          </div>
          <ol id="candidateList" class="candidate-list"></ol>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
